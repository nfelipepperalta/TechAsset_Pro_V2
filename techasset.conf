# ============================================================
#  TechAsset Pro — Configuración Apache
#  Ubuntu Server + Apache2 + PHP 8.3
#  Archivo: /etc/apache2/sites-available/techasset.conf
# ============================================================

<VirtualHost *:80>

    ServerName techasset.empresa.com
    ServerAlias www.techasset.empresa.com

    # Apunta a la carpeta PUBLIC del proyecto
    DocumentRoot /var/www/techasset-pro/public

    <Directory /var/www/techasset-pro/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear acceso directo a carpetas internas
    <Directory /var/www/techasset-pro/core>
        Require all denied
    </Directory>
    <Directory /var/www/techasset-pro/config>
        Require all denied
    </Directory>
    <Directory /var/www/techasset-pro/repositories>
        Require all denied
    </Directory>
    <Directory /var/www/techasset-pro/services>
        Require all denied
    </Directory>
    <Directory /var/www/techasset-pro/controllers>
        Require all denied
    </Directory>

    # Logs
    ErrorLog  ${APACHE_LOG_DIR}/techasset_error.log
    CustomLog ${APACHE_LOG_DIR}/techasset_access.log combined

</VirtualHost>
